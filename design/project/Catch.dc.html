<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daybook — catch a scrap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&amp;family=Nunito:wght@400..800&amp;display=swap">
<style>
body{margin:0}
a{color:#2E2A3B}a:hover{color:#9E2456}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background-color: #EEE8FB; background-image: radial-gradient(rgba(255,255,255,0.95) 1.6px, transparent 2.2px); background-size: 30px 30px; color: #2E2A3B; font-family: 'Nunito', system-ui, sans-serif; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; box-sizing: border-box; border-radius: 999px; background: #FF9EC0; border: 3px solid #FFFFFF; box-shadow: 0 3px 6px rgba(94,72,140,0.2); transform: rotate(-8deg)">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 2C13 9 15 11 22 12C15 13 13 15 12 22C11 15 9 13 2 12C9 11 11 9 12 2Z" fill="#FFFFFF"></path></svg>
      </span>
      <span style="font-family: 'Fredoka', system-ui, sans-serif; font-size: 22px; font-weight: 600">Daybook</span>
    </div>
    <a href="DeskPastel.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 2px 0 rgba(94,72,140,0.1); text-decoration: none; font-family: 'Fredoka', system-ui, sans-serif; font-size: 15px; font-weight: 500">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l2.5-7h11l2.5 7v6H4z"></path><path d="M4 13h5l1 2h4l1-2h5"></path></svg>
      Tray · 6
    </a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-family: 'Fredoka', system-ui, sans-serif; font-size: 36px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.05">Catch it</h1>
    <span style="font-family: 'Fredoka', system-ui, sans-serif; font-size: 14px; font-weight: 500; color: #5F5873">Mon 26 Oct · 16:45</span>
  </div>

  <div style="position: relative; background-color: #FFFFFF; background-image: linear-gradient(rgba(194,56,107,0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(194,56,107,0.09) 1px, transparent 1px); background-size: 20px 20px; color: #2E2A3B; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 0 rgba(94,72,140,0.08), 0 14px 28px rgba(94,72,140,0.2)">
    <div aria-hidden="true" style="position: absolute; top: -10px; right: 30px; width: 80px; height: 22px; background-color: rgba(255,158,192,0.8); background-image: radial-gradient(rgba(255,255,255,0.95) 2.5px, transparent 3px); background-size: 12px 12px; border-radius: 3px; transform: rotate(5deg)"></div>
    <label for="catch-text" style="font-family: 'Fredoka', system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #5F5873">What just happened?</label>
    <textarea id="catch-text" rows="4" style="width: 100%; height: 108px; box-sizing: border-box; padding: 0; border: 0; background: transparent; resize: none; color: #2E2A3B; font-family: 'Nunito', system-ui, sans-serif; font-size: 21px; line-height: 1.45">sky over the parking garage. unreal.</textarea>
    <div style="display: flex; align-items: center; gap: 10px">
      <svg viewBox="0 0 200 160" width="48" height="48" role="img" aria-label="Attached photo: sunset over the parking garage" style="flex: none; border-radius: 10px; border: 3px solid #FFFFFF; box-shadow: 0 2px 6px rgba(94,72,140,0.25)" preserveAspectRatio="xMidYMid slice">
        <rect x="0" y="0" width="200" height="62" fill="#C9B8F5"></rect>
        <rect x="0" y="62" width="200" height="26" fill="#FFB8CF"></rect>
        <rect x="0" y="88" width="200" height="72" fill="#FFD6B8"></rect>
        <circle cx="152" cy="100" r="20" fill="#FFE38A"></circle>
        <rect x="0" y="96" width="124" height="64" fill="#8C7FB0"></rect>
        <rect x="124" y="118" width="76" height="42" fill="#8C7FB0"></rect>
      </svg>
      <span style="flex: 1 1 auto; font-family: 'Fredoka', system-ui, sans-serif; font-size: 13px; font-weight: 500; color: #5F5873">1 photo</span>
      <button type="button" style="min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 999px; border: 0; background: #F3EFFC; color: #2E2A3B; font-family: 'Fredoka', system-ui, sans-serif; font-size: 14px; font-weight: 500; cursor: pointer">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        Add photo
      </button>
    </div>
  </div>

  <div role="group" aria-labelledby="mood-label" style="display: flex; flex-direction: column; gap: 8px">
    <span id="mood-label" style="font-family: 'Fredoka', system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #5F5873">Mood · optional</span>
    <div style="display: flex; justify-content: space-between; gap: 4px">
      <sc-for list="{{moods}}" as="item" hint-placeholder-count="5">
        <button type="button" aria-pressed="{{item.pressed}}" onClick="{{item.pick}}" style="width: 64px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; border-radius: 18px; border: 3px solid {{item.ring}}; background: {{item.bg}}; color: #2E2A3B; cursor: pointer">
          <svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
            <circle cx="20" cy="20" r="17" fill="{{item.face}}" stroke="#FFFFFF" stroke-width="3"></circle>
            <circle cx="14" cy="17" r="2.2" fill="#2E2A3B"></circle>
            <circle cx="26" cy="17" r="2.2" fill="#2E2A3B"></circle>
            <circle cx="10" cy="23" r="2.4" fill="#FF9EC0"></circle>
            <circle cx="30" cy="23" r="2.4" fill="#FF9EC0"></circle>
            <path d="{{item.mouth}}" fill="{{item.mouthFill}}" stroke="#2E2A3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span style="font-family: 'Fredoka', system-ui, sans-serif; font-size: 13px; font-weight: {{item.weight}}">{{item.label}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <button type="button" style="width: 100%; min-height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 999px; background: #C2386B; color: #FFFFFF; font-family: 'Fredoka', system-ui, sans-serif; font-size: 18px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 0 #9E2456">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11M7 9l5 5 5-5M4 15v5h16v-5"></path></svg>
    Tuck into tray
  </button>
  <p style="margin: 0; text-align: center; font-size: 15px; color: #5F5873">No formatting, no fuss. The desk is for making it pretty.</p>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; font-family: 'Fredoka', system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #5F5873">Earlier today</h2>
    <div style="display: flex; gap: 12px; align-items: baseline; padding: 10px 14px; background: #D4F3E6; color: #2E2A3B; border-radius: 12px; transform: rotate(-0.6deg); box-shadow: 0 6px 12px rgba(94,72,140,0.14)">
      <span style="flex: none; font-family: 'Fredoka', system-ui, sans-serif; font-size: 13px; font-weight: 500; color: #5F5873">14:10</span>
      <span style="font-size: 16px; line-height: 1.35">finally ate lunch. cold pasta, zero regrets</span>
    </div>
    <div style="display: flex; gap: 12px; align-items: baseline; padding: 10px 14px; background: #FFF1B8; color: #2E2A3B; border-radius: 12px; transform: rotate(0.5deg); box-shadow: 0 6px 12px rgba(94,72,140,0.14)">
      <span style="flex: none; font-family: 'Fredoka', system-ui, sans-serif; font-size: 13px; font-weight: 500; color: #5F5873">07:40</span>
      <span style="font-size: 16px; line-height: 1.35">made it in on time. small miracle.</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = (this.state && this.state.mood) || 'good';
    const base = [
      { id: 'rough', label: 'rough', face: '#C9B8F5', mouth: 'M13 29Q20 22 27 29' },
      { id: 'meh', label: 'meh', face: '#D5CEEA', mouth: 'M13 27L27 27' },
      { id: 'okay', label: 'okay', face: '#9ED9C5', mouth: 'M13 26Q20 29.5 27 26' },
      { id: 'good', label: 'good', face: '#FFE38A', mouth: 'M12 24Q20 32 28 24' },
      { id: 'great', label: 'great', face: '#FFC9A8', mouth: 'M11 23Q20 36 29 23Z' }
    ];
    const moods = base.map((m) => {
      const on = m.id === sel;
      return Object.assign({}, m, {
        ring: on ? '#C2386B' : 'transparent',
        bg: on ? '#FFFFFF' : 'rgba(255,255,255,0.5)',
        weight: on ? '700' : '500',
        pressed: on ? 'true' : 'false',
        mouthFill: m.id === 'great' ? '#2E2A3B' : 'none',
        pick: () => this.setState({ mood: m.id })
      });
    });
    return { moods: moods };
  }
}
</script>
</body>
</html>
